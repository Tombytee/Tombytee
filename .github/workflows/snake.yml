name: Generate Snake Animation

on:
  # Har 12 ghante mein snake refresh hoga
  schedule:
    - cron: "0 */12 * * *"
  # Manual run ke liye (Actions tab -> Run workflow)
  workflow_dispatch:
  # Jab bhi main branch par push ho
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23E11D48&color_dots=%23EBEDF0,%239BE9DA,%2338D9B8,%2300B894,%23007A66&color_dot_border=%23FFFFFF
            dist/github-snake-dark.svg?color_snake=%23FF5C8A&color_dots=%23222B38,%230B5D52,%2300A388,%2300D9A6,%237FFFE0&color_dot_border=%230D1117

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
