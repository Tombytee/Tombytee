name: Update Contribution Snake

# Run on a schedule (daily) and also on every push to the default branch
on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC
  push:
    branches: [ main, master ]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the generated SVGs
    steps:
      # ----- 1️⃣ Checkout the repository ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for a clean commit history

      # ----- 2️⃣ Set up Python (the snake generator is a Python script) -------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ----- 3️⃣ Install the snake generator ------------------------------------
      - name: Install snake generator
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/rajat-1999/github-readme-activity-graph.git

      # ----- 4️⃣ Generate the SVGs (light & dark) -----------------------------
      - name: Generate snake SVG (light)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tool uses the env var `GITHUB_TOKEN` to query the API
          python -m github_readme_activity_graph \
            --username ${{ github.repository_owner }} \
            --output ./output/github-snake.svg \
            --theme default \
            --color 00D9A6 \
            --bg-color 0D1117

      - name: Generate snake SVG (dark)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m github_readme_activity_graph \
            --username ${{ github.repository_owner }} \
            --output ./output/github-snake-dark.svg \
            --theme dark \
            --color 00D9A6 \
            --bg-color 0D1117

      # ----- 5️⃣ Commit & push the generated files -----------------------------
      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add only the snake files (creates them if they changed)
          git add output/github-snake.svg output/github-snake-dark.svg
          
          # Check if there is anything to commit
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Update contribution snake (auto‑generated)"
            git push
          else
            echo "✅ No changes – snake image already up‑to‑date"
          fi
